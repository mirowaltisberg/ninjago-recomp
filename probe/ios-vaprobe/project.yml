name: VAProbe
options:
  bundleIdPrefix: ch.mirowaltisberg.njprobe
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 43DHLG947A
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchStoryboardName: ""
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VAProbe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.mirowaltisberg.njprobe.plain
        INFOPLIST_KEY_CFBundleDisplayName: "VA Probe"
  VAProbeEVA:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: VAProbeEVA.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.mirowaltisberg.njprobe.eva
        INFOPLIST_KEY_CFBundleDisplayName: "VA Probe EVA"
